name: Update GitHub stats

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - '.github/workflows/update-stats.yml'

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test generator
        run: python -m unittest discover -s tests -v
      - name: Generate cards
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: python scripts/update_stats.py
      - name: Commit updated cards
        run: |
          git add assets/github-overview.svg assets/github-languages.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: refresh profile stats"
          git push
